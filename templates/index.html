<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暗雷30</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">MULTIPLAYER BOARD GAME</div>
      <h1>暗雷 <span>30</span></h1>
      <p class="subtitle">3–6 人在线桌游原型</p>
    </header>

    <section id="entry" class="panel">
      <label for="playerName">玩家昵称</label>
      <input id="playerName" maxlength="18" placeholder="输入你的昵称">
      <div class="actions">
        <button id="createBtn" class="primary">创建房间</button>
      </div>
      <div class="join-row">
        <input id="roomCode" maxlength="5" placeholder="房间号码">
        <button id="joinBtn">加入房间</button>
      </div>
      <p class="hint">每个玩家使用自己的手机或电脑进入同一个房间。</p>
    </section>

    <section id="game" class="hidden">
      <section class="panel room-head">
        <div>
          <div class="muted">房间号码</div>
          <div id="codeDisplay" class="room-code">-----</div>
        </div>
        <div id="statusDisplay" class="status">等待玩家</div>
      </section>

      <section class="panel">
        <div class="section-title">玩家列表</div>
        <div id="players" class="players"></div>
        <button id="startBtn" class="primary full hidden">房主：开始游戏</button>
      </section>

      <section class="panel private-panel">
        <div class="section-title">你的私人信息</div>
        <div class="private-number" id="myMine">—</div>
        <div class="muted">只有你自己能看到你的暗雷数字</div>
        <div id="immunityInfo" class="hint"></div>
      </section>

      <section class="panel board-panel">
        <div class="section-title">30 格棋盘</div>
        <div id="board" class="board"></div>
      </section>

      <section class="panel turn-panel">
        <div id="turnInfo" class="turn-info">等待游戏开始</div>
        <button id="rollBtn" class="primary full" disabled>掷骰子</button>
        <p id="gameMessage" class="message">创建或加入房间后等待其他玩家。</p>
      </section>
    </section>

    <div id="toast" class="toast"></div>
    <footer>暗雷30 · 测试原型</footer>
  </main>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
